<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site_name }} &mdash; All Events</title>
  <meta name="description" content="Browse every event page generated by {{ site_name }}.">
  <link rel="canonical" href="{{ base_url }}/">
</head>
<body class="listing-page">
  <header>
    <h1>{{ site_name }}</h1>
    <p>Browse all events, grouped by type.</p>
  </header>
  <main>
    {% for subtype, items in events_by_subtype.items() %}
    <section>
      <h2>{{ subtype.title() }}</h2>
      <ul>
        {% for item in items %}
        <li><a href="{{ item.url }}">{{ item.name }}</a></li>
        {% endfor %}
      </ul>
    </section>
    {% endfor %}
  </main>
  <footer>
    <p>&copy; {{ site_name }}</p>
  </footer>
</body>
</html>
